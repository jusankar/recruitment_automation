databases:
  - name: recruitment-postgres
    plan: free
    databaseName: interviewdb
    user: recruitment_admin

services:
  - type: web
    name: recruitment-talentmatchai
    runtime: docker
    plan: free
    rootDir: TalentMatchAI
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_NAME
        value: TalentMatchAI
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CHROMA_PERSIST_DIR
        value: /app/chroma_db
      - key: COLLECTION_NAME
        value: resumes
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TIMEOUT
        value: "60"
      - key: TOP_K
        value: "20"
      - key: SIMILARITY_THRESHOLD
        value: "0.7"
      - key: MAX_BATCH_SIZE
        value: "100"
      - key: MAX_RESUME_LENGTH
        value: "20000"
      - key: UPLOAD_DIR
        value: /app/uploads

  - type: web
    name: recruitment-interviewaix
    runtime: docker
    plan: free
    rootDir: InterviewAIx
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: recruitment-postgres
          property: connectionString
