name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  hirematrixui:
    name: HireMatrixUI - Lint, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HireMatrixUI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: HireMatrixUI/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build Docker image
        working-directory: .
        run: docker build -t local/recruitment-hirematrixui:ci-${{ github.sha }} HireMatrixUI

  interviewaix:
    name: InterviewAIx - Lint, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InterviewAIx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app tests --select E9,F63,F7,F82

      - name: Test
        run: pytest -q -p no:cacheprovider

      - name: Build Docker image
        working-directory: .
        run: docker build -t local/recruitment-interviewaix:ci-${{ github.sha }} InterviewAIx

  talentmatchai:
    name: TalentMatchAI - Lint, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TalentMatchAI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app tests --select E9,F63,F7,F82

      - name: Test
        run: pytest -q -p no:cacheprovider

      - name: Build Docker image
        working-directory: .
        run: docker build -t local/recruitment-talentmatchai:ci-${{ github.sha }} TalentMatchAI
