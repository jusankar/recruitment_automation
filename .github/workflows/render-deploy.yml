name: Render Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger TalentMatchAI deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_TALENTMATCHAI }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Missing secret: RENDER_DEPLOY_HOOK_TALENTMATCHAI"
            exit 1
          fi
          curl -fsS -X POST "$HOOK"

      - name: Trigger InterviewAIx deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_INTERVIEWAIX }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Missing secret: RENDER_DEPLOY_HOOK_INTERVIEWAIX"
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
